# Override for pricing-only slices: keeps physical display size (so mm-based
# support/pad math is unchanged) but drops pixel count way down. Print time and
# resin volume come from layer count x exposure time and mesh geometry, not from
# raster pixel count, so this doesn't affect the numbers we actually care about --
# it just avoids PrusaSlicer OOM-crashing while rasterizing 12K-res PNGs per layer
# for files we're never going to actually send to a printer.
display_pixels_x = 1152
display_pixels_y = 512
