# Custom PrusaSlicer SLA config for Anycubic Photon M5s.
#
# PrusaSlicer 2.9.6's bundled AnycubicSLA.ini has no Photon M5s preset (its newest
# entries top out at Mono X 6K), so this was built by hand: printer geometry from
# Anycubic's published M5s specs (12K mono LCD, 11520x5120 px, ~19x24 micron pixels,
# 218x123mm screen), everything else (pad/support settings, exposure timing, lift
# speeds) copied from the closest bundled profile (Photon Mono X 6K + its default
# "Plant-based UV Resin Grey 23" material) as a first-pass approximation. Exposure
# time in particular is a guess, not measured on this printer -- fine for a rough
# volume/time estimate, but revisit if computed print times look off vs reality.
#
# Usage: prusa-slicer-console.exe --load anycubic-photon-m5s.ini --export-sla -o out/ file.stl
#        (or --info for a quick volume-only readout)

printer_technology = SLA
printer_model = PHOTON M5S
printer_variant = default

# --- Bed / display geometry ---
bed_shape = 1.48x1.02,216.48x1.02,216.48x123.02,1.48x123.02
max_print_height = 218
display_width = 218.88
display_height = 122.88
display_pixels_x = 11520
display_pixels_y = 5120
display_orientation = landscape
display_mirror_x = 1
display_mirror_y = 0

thumbnails = 224x168
sla_archive_format = pwmx
output_filename_format = [input_filename_base].pwmx

# --- Exposure bounds / correction (copied from Mono X 6K) ---
elefant_foot_compensation = 0.2
elefant_foot_min_width = 0.2
min_exposure_time = 1
max_exposure_time = 120
min_initial_exposure_time = 1
max_initial_exposure_time = 300
printer_correction = 1,1,1
gamma_correction = 1

# --- Print profile (layer height + pad/support settings, from *common print ANYCUBIC SLA*) ---
layer_height = 0.05
pad_edge_radius = 0.5
pad_enable = 1
pad_max_merge_distance = 50
pad_wall_height = 0
pad_wall_thickness = 1
pad_wall_slope = 45
faded_layers = 8
slice_closing_radius = 0.005
support_base_diameter = 3
support_base_height = 1
support_critical_angle = 45
support_density_at_45 = 250
support_density_at_horizontal = 500
support_head_front_diameter = 0.4
support_head_penetration = 0.4
support_head_width = 3
support_max_bridge_length = 10
support_minimal_z = 0
support_object_elevation = 5
support_pillar_diameter = 1
support_pillar_connection_mode = zigzag
support_pillar_widening_factor = 0
supports_enable = 1
support_small_pillar_diameter_percent = 60%

# --- Material / exposure timing (from Anycubic Plant-based UV Resin Grey 23 @MONO 0.05) ---
exposure_time = 2.3
initial_exposure_time = 23
initial_layer_height = 0.05
material_correction = 1,1,1
area_fill = 45
material_notes = LIFT_DISTANCE=8.0\nLIFT_SPEED=2\nRETRACT_SPEED=3.0\nBOTTOM_LIFT_SPEED=2.0\nBOTTOM_LIFT_DISTANCE=9.0\nDELAY_BEFORE_EXPOSURE=0.5\nANTIALIASING=1

# --- Pricing (this project's own convention, not a PrusaSlicer setting) ---
# resin_cost_eur_per_kg = 150
